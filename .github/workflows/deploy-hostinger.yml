name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Hostinger via lftp
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:use-pget-n 1
          mirror -R --delete --verbose --parallel=1 ./dist/ ./
          bye
          EOF
        env:
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
